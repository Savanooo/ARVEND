name: arvend
description: "ARVEND Yapı - saha ekibi için proje/teklif/metraj mobil uygulaması."
publish_to: 'none'

version: 1.5.1+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigasyon
  go_router: ^16.2.4

  # Network
  dio: ^5.9.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0

  # Oturum dışı hassas değerler için (bkz. core/auth) - refresh/access token
  # zaten HttpOnly cookie olarak backend'de kalır, burada JS/Dart tarafına
  # çıkarılan bir token YOK; bu yalnızca cookie jar'ın disk kalıcılığı için.
  path_provider: ^2.1.5

  # Türkçe tarih/sayı formatlama
  intl: ^0.20.2

  # Dosya/fotoğraf
  image_picker: ^1.2.0
  file_picker: ^10.3.4
  cached_network_image: ^3.4.1
  # İndirilen bir belgeyi (PDF/Word/Excel/vb.) OS'un kendi görüntüleyicisiyle
  # açmak için -- ne url_launcher (file:// URI'leri Android FileProvider
  # olmadan güvenilir değildir) ne de mevcut hiçbir paket bunu karşılıyor;
  # bkz. projects_repository.dart fileBytes() + project_detail_screen.dart.
  open_filex: ^4.7.0

  # Basit local tercih (aktif sekme vb.) - hassas veri İÇİN DEĞİL
  shared_preferences: ^2.5.5

  # "Hakkında" ekranında sürüm/derleme numarasını pubspec.yaml'dan okur --
  # sabit kodlanmış bir sürüm string'i YOK.
  package_info_plus: ^8.3.1

  # Müşteri detayında tel:/mailto: aksiyonları için (bkz. customer_detail_screen.dart)
  url_launcher: ^6.3.1

  # Uzaktan güncelleme: indirilen APK'nın SHA-256 özetini sunucunun
  # /mobile/app-version yanıtıyla karşılaştırmak için (Dart ekibinin paketi;
  # zaten dolaylı bağımlılıktı). bkz. lib/core/update/.
  crypto: ^3.0.7

  # ApiClient.test factory'sindeki @visibleForTesting için (transitive olarak
  # zaten mevcut, doğrudan bağımlılık olarak da bildiriliyor).
  meta: ^1.16.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Giriş ekranı logosu (scripts/ikon_uret.py üretir).
  assets:
    - assets/brand/arvend_logo.png

  # Tek değişken-genişlikli (variable) dosya, ağırlık ekseni 100-900 --
  # her `weight:` girişi AYNI dosyaya işaret eder, Flutter doğru ağırlığı
  # dosyanın kendi 'wght' ekseninden çözer. Google Fonts'tan (Apache 2.0)
  # indirilip statik olarak paketlendi -- çalışma zamanında ağ isteği YOK
  # (bkz. AppTheme, sahada çevrimdışı kullanım önceliği).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 800
